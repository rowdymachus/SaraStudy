<!DOCTYPE html>

<head>

<style>
/* Layout idea: a student's history notebook. Navy ink on cool paper, an ultramarine pen for actions,
   and her own lime highlighter marking what she underlined in the book. One column, thumb-sized controls. */
:root{
  --paper:#f5f6f9; --card:#ffffff; --ink:#1c2340; --muted:#5d6584; --line:#dfe3ec;
  --pen:#2f48d0; --pen-ink:#ffffff; --marker:#d6f57f; --marker-ink:#1c2340;
  --good:#23885a; --mid:#c3870f; --bad:#c23d36;
  --display:'PT Serif', Georgia, 'Times New Roman', serif;
  --body:'PT Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141d; --card:#1a1e2b; --ink:#e7e9f2; --muted:#9aa1ba; --line:#2b3145;
    --pen:#8ea0ff; --pen-ink:#0f1220; --marker:#4c6a12; --marker-ink:#f3ffd9;
    --good:#4fc78c; --mid:#e3ae3f; --bad:#ef6f67; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141d; --card:#1a1e2b; --ink:#e7e9f2; --muted:#9aa1ba; --line:#2b3145;
  --pen:#8ea0ff; --pen-ink:#0f1220; --marker:#4c6a12; --marker-ink:#f3ffd9;
  --good:#4fc78c; --mid:#e3ae3f; --bad:#ef6f67; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar h1{font-family:var(--display);font-size:1.15rem;margin:0;flex:1;line-height:1.2;text-wrap:balance}
.bar h1 small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
#installBtn{background:var(--pen);color:var(--pen-ink);border-color:var(--pen)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--card);color:var(--ink);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90%;overflow:auto}
.sheet ol{padding-left:1.3em;margin:8px 0 16px}.sheet li{margin:8px 0}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--paper);font-weight:700}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.85rem;font-weight:700;min-height:38px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:700;border:1px solid var(--line);background:var(--card);min-height:48px}
.btn.primary{background:var(--pen);color:var(--pen-ink);border-color:var(--pen)}
.btn.block{width:100%}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.mid{background:var(--mid);border-color:var(--mid);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0}
h2{font-family:var(--display);font-size:1.5rem;line-height:1.2;margin:20px 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-size:1.12rem;margin:0 0 6px;line-height:1.3;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.hero{border:2px solid var(--pen)}
.mk{background:linear-gradient(transparent 12%, var(--marker) 12%, var(--marker) 88%, transparent 88%);color:var(--marker-ink);padding:0 3px;border-radius:2px;font-weight:700;font-size:.75rem;white-space:nowrap}
.lesson{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.num{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--pen);min-width:28px;line-height:1.2}
.lesson .t{font-weight:700;line-height:1.3}
.meter{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--good);border-radius:6px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0;position:sticky;top:62px;z-index:4}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:700;font-size:.9rem;color:var(--muted);min-height:42px}
.tabs button[aria-selected="true"]{background:var(--pen);color:var(--pen-ink)}
.start{border-left:4px solid var(--pen)}
.start p{margin:6px 0 0;font-family:var(--display);font-size:1.05rem}
ol.skel{margin:6px 0 0;padding-left:1.4em}
ol.skel li{margin:3px 0}
.step{position:relative}
.step .head{display:flex;gap:10px;align-items:baseline}
.step .head .num{font-size:1.1rem;min-width:22px}
.step p{margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-left:auto;flex:none;align-self:center}
.dot.s2{background:var(--good)}.dot.s1{background:var(--mid)}.dot.s0{background:var(--bad)}
dl.terms{margin:0}
dl.terms dt{font-weight:700;margin-top:8px}
dl.terms dd{margin:0;color:var(--muted)}
.big{font-family:var(--display);font-size:1.6rem;line-height:1.25;margin:8px 0;text-wrap:balance}
.progress-txt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:.85rem}
.answer{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:48px;font-variant-numeric:tabular-nums}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.timer{font-family:var(--display);font-size:2.6rem;font-variant-numeric:tabular-nums;text-align:center;margin:10px 0}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:24px;height:24px;margin-top:2px;accent-color:var(--good);flex:none}
.plan li{margin:4px 0}
.note{background:color-mix(in srgb,var(--mid) 14%,var(--card));border-color:color-mix(in srgb,var(--mid) 45%,var(--line))}
.back{border:0;background:none;color:var(--pen);font-weight:700;padding:8px 0;min-height:40px}
.hint{color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion: no-preference){ .fade{animation:f .18s ease-out} @keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<header><div class="bar">
  <h1 id="apptitle">Сара учи историју<small>Свијет од краја XV до краја XVII вијека</small></h1>
  <button class="icon-btn" id="installBtn" hidden>Инсталирај</button>
  <button class="icon-btn" id="scriptBtn" aria-label="Промијени писмо">LAT</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetPanel"></div></div>

<script>
const LESSONS = [
{
id:'l1', n:1, title:'Велика географска открића', pages:'10–14', mark:'Подвучено у књизи',
start:'Велика географска открића десила су се крајем 15. и почетком 16. вијека. Прво ћу рећи шта су Европљани знали о свијету прије открића, затим предуслове и узроке, па сама открића редом, колонизацију и на крају посљедице.',
steps:[
['Шта се знало прије','У средњем вијеку Европљани су имали скромно знање о земљи. Познавали су простор од Средоземља до Балтика, слабо су знали Азију, а нешто боље обале сјеверне Африке. За Америку и Аустралију нису знали ништа. Петнаести вијек је прекретница: штампа се књига, ратује се барутом, развијају се наука, умјетност и привреда. Зато се јавља жеља да се упозна свијет ван Европе.','Средоземље до Балтика · слабо Азија · без Америке и Аустралије · 15. вијек прекретница',1],
['Гутенберг и штампа','Јохан Гутенберг из Мајнца (око 1400–1468) почео је да користи покретна метална слова, која су се могла користити више пута. Уз новац трговца Јохана Фуста отворио је штампарију и пронашао штампарску боју. Прва штампана књига била је Библија, завршена 1456. године, названа Б 42 јер је имала 42 реда. Ово откриће је важно као парна машина и компјутер.','Мајнц · покретна слова · Библија 1456 · Б 42',0],
['Технички предуслови','Бројни изуми омогућили су дужа путовања. Од 14. вијека праве се поузданије карте, прво у италијанским градовима. Најпознатија је карта Паола Тосканелија: показивала је да се идући на запад стиже до Индије, јер је Земља округла. Мартин Бехајм је 1492. у Нирнбергу направио први глобус. Компас је усавршен око 1300. године, а користе се и астролаб и дурбин. Усавршено је ватрено оружје, а нови бродови, каравеле, имају три јарбола, више једара, топове и наоружану посаду.','Тосканели: на запад до Индије · Бехајм, глобус 1492 · компас, астролаб, дурбин · каравеле',1],
['Узроци: зашто су кренули','Европи је недостајало злата и сребра, а вјеровало се да их на истоку има у изобиљу. Роба са истока ишла је копном преко много посредника, па је била прескупа. Османлије су заузеле источно Средоземље и сметале трговини. Зато трговци траже поморски пут до Индије, да сами увозе робу, а владари финансирају експедиције у интересу својих држава.','злато и сребро · скупи посредници · Османлије · владари плаћају',1],
['Португалци око Африке','Прве експедиције организовали су Португалци. Мислили су да је Африка краћа и да ће брзо стићи до Индије. Међу првима је био Хенри Морепловац, португалски принц, који је скупљао знања и слао експедиције. Бартоломео Дијаз је 1487. стигао до југа Африке, али су га велики таласи вратили; тај врх назван је Рт добре наде. Васко да Гама је 1498. опловио Африку и стигао до Калкуте у Индији. Португалци су 1511. заузели Малаку, Шри Ланку и Гоу и основали трговачка насеља.','Хенри Морепловац · Дијаз 1487, Рт добре наде · Васко да Гама 1498, Калкута · 1511 Малака, Гоа',1],
['Колумбо и откриће Америке','Убрзо се укључују и Шпанци. Ђеновљанин Кристифор Колумбо вјеровао је да се идући на запад стиже до Индије. Краљица Изабела дала му је новац и он са Тосканелијевом картом креће из луке Палос љета 1492. године. Дванаестог октобра 1492. стигао је до острва Гванахани (Сан Салвадор). До смрти је мислио да је открио Индију, иако је путовао још три пута (1494, 1498, 1504) и открио Порторико, Јамајку, Тринидад и дијелове Средње и Јужне Америке. Нови континент добио је име по Америгу Веспучију, који је 1507. описао те земље.','Изабела · Палос 1492 · 12. 10. 1492. Гванахани · мислио да је Индија · Америго Веспучи',1],
['Стари народи Америке','Људи су у Америку дошли прије око 15 000 година, преко копна између Сибира и Аљаске. Маје (врхунац 300–900) живјеле су у данашњој Гватемали, Белизеу и Мексику; познате су по календару, математици, астрономији, писму и степенастим пирамидама. Астеци су имали главни град Теночтитлан (данас Мексико Сити); Монтезума је мислио да је Кортес бог, а град је пао 1521. Инке су владале из Куска, од Еквадора до Чилеа; њихов град је Мачу Пикчу, а царство је освојио Франциско Пизаро.','Маје: календар, пирамиде · Астеци: Теночтитлан, Монтезума · Инке: Куско, Мачу Пикчу',0],
['Магелан и пут око свијета','Педро Кабрал је 1500. за Португал стигао до Бразила. Васко Нуњез де Балбоа прешао је Панаму и открио Тихи океан. Највећа заслуга припада Фернанду Магелану, Португалцу у служби шпанског краља Карла I. Његова експедиција (1519–1522) открила је Магеланов пролаз и прешла Тихи океан до Маријанских и Филипинских острва, гдје је Магелан погинуо у борби са домороцима. Од пет бродова и 250 морнара вратио се само брод „Викторија“ са 18 људи. Тако је први пут опловљена Земља и доказано да је округла.','Кабрал 1500, Бразил · Балбоа, Тихи океан · Магелан 1519–1522 · „Викторија“, 18 морнара · Земља је округла',1],
['Подјела свијета и остали','Португалци и Шпанци тражили су од папе Александра Борџије да повуче границу између њих. Уговором у Тордесиљасу одлучено је да све што је даље од 360 миља од Зеленортских острва припада Шпанији, а остало Португалу, који је тако добио Бразил. Укључиле су се и друге земље: Ђовани и Себастијан Кабот за Енглеску открили су Њуфаундленд и обале Нове Енглеске, а Жак Картије за Француску истраживао је обале Канаде. Посљедњи континент који су Европљани открили била је Аустралија.','папа Александар Борџија · Тордесиљас · Кабот: Њуфаундленд · Картије: Канада · Аустралија посљедња',1],
['Колонизација Новог свијета','Шпанац Хернан Кортез 1519. прелази са Кубе у Мексико и уништава Астеке, а Франциско Пизаро осваја Перу и уништава Инке. Откривени су рудници злата и сребра, а најважнији рударски град био је Потоси. Шпанци су наметали своју власт, језик и католичку вјеру и искоришћавали земљу и људе, а домороци су уништени или асимиловани. За кратко вријеме Европљани су основали много колонија.','Кортез 1519: Астеци · Пизаро: Инке · Потоси · језик и вјера наметнути',1],
['Посљедице открића','Земље које су прве кренуле у открића (Португал, Шпанија, Енглеска, Француска) постале су најразвијеније. Развијају се наука и бродоградња, мијешају се културе. Европа упознаје кукуруз, кромпир, парадајз, ванилу, какао, кикирики, ламе и ћурке, а у Нови свијет преноси коње, овце, говеда, козе и винову лозу. Трговина се сели са Средоземља на Атлантик. Негативно: домороци су тјерани на најтежи рад и већином су страдали, уништене су њихове цивилизације, а у Сјеверну Америку довођени су робови из Африке, што је почетак ропства.','најразвијеније државе · кукуруз, кромпир, парадајз · коњи, овце · Средоземље → Атлантик · страдање домородаца, ропство',1]
],
qs:[
['Наведите и објасните предуслове и узроке великих географских открића.','Предуслови: нове карте (Тосканели), глобус, компас, астролаб, дурбин, каравеле и ватрено оружје. Узроци: мањак злата и сребра, скупа роба због посредника, Османлије блокирају трговину, трговци хоће директан увоз, а владари финансирају експедиције.'],
['Зашто су Европљани тражили нове путеве до Истока?','Копнени пут био је скуп због много посредника, а Османлије су заузеле источно Средоземље. Морски пут до Индије значио је јефтинију робу и директну трговину.'],
['Које су државе прве покренуле велика поморска путовања?','Португал, а убрзо после њега Шпанија.'],
['Набројте хронолошким редом велика географска открића.','1487. Дијаз, Рт добре наде; 1492. Колумбо, Америка; 1498. Васко да Гама, Индија; 1500. Кабрал, Бразил; Балбоа, Тихи океан; 1519–1522. Магелан око свијета; на крају Аустралија.'],
['Које су државе основале прве колоније?','Португал (Африка, Индија, Малака, Гоа, Бразил) и Шпанија (Мексико, Перу, Средња и Јужна Америка).'],

['Ко је био Васко да Гама?','Португалски морепловац (1469–1524), први је опловио Африку и 1498. стигао до Калкуте, тј. нашао поморски пут до Индије.'],

{
id:'l2', n:2, title:'Зачеци капиталистичке привреде у оквирима феудалног друштва', short:'Зачеци капиталистичке привреде', pages:'15–17',
start:'На почетку новог вијека у Европи, још у феудалном друштву, почиње да се развија капиталистичка привреда. Говорићу о порасту становништва и градова, о трговини која се сели на Атлантик, о револуцији цијена, мануфактурама, ограђивању у Енглеској и о друштвеним промјенама.',
steps:[
['Становништво и градови','Пораст броја становника је једна од одлика новог доба. Расту велики градови. Највећи град на почетку новог вијека био је Цариград, са 100 000 становника крајем 15. вијека. Развијају се и италијански градови Рим, Венеција, Милано и Ђенова, а затим Москва, Париз и Лондон.','Цариград 100 000 · Рим, Венеција, Милано, Ђенова · Москва, Париз, Лондон'],
['Трговина се сели на Атлантик','Трговачки путеви и центри помјерају се у земље које су прве основале колоније. Средоземно море губи значај, а Атлантски океан постаје главни пут. Водеће трговачке силе постају државе на Атлантику: Шпанија, Португал, Холандија, Енглеска и Француска.','Средоземље губи значај · Атлантик главни пут · Шпанија, Португал, Холандија, Енглеска, Француска'],
['Револуција цијена','У средњем вијеку цијене хране нису расле, чак су и падале. Због пораста становништва требало је више производа, а истовремено је из Новог свијета у Европу стизало много злата и сребра. Новца је било више него робе, па је новац губио вриједност, а цијене су нагло расле. Тај велики скок цијена зове се „револуција цијена“ и довео је до инфлације.','више становника · злато из Америке · више новца него робе · инфлација'],
['Мануфактуре','Занатска производња више није могла да задовољи потребе. Од 15. вијека развијају се мануфактуре: радионице са више радника, гдје се ради ручно, али је посао подијељен на операције, као у ланцу. Тако се брже прави више производа, а радник учи само једну операцију. Адам Смит наводи да је посао око једне игле подијељен на 18 операција, па је 10 радника правило 48 000 игала дневно. Мануфактуре могу бити централизоване (сви раде на једном мјесту) и децентрализоване (радници раде код куће). Трајале су до појаве парне машине.','подјела рада на операције · игла: 18 операција · централизоване и децентрализоване · до парне машине'],
['Профит и првобитна акумулација','Капиталисти улажу у средства за рад, предмете рада и радну снагу. Разлика између уложеног новца и цијене робе на тржишту је профит. Мануфактуре су први облик капиталистичке производње, а профит првих капиталиста зове се првобитна акумулација капитала. Остваривао се на три начина: искоришћавањем радника у мануфактурама, искоришћавањем рудара у рудницима и ограђивањем у Енглеској.','профит · 1. мануфактуре · 2. рудници · 3. ограђивање'],
['Ограђивање у Енглеској','У Енглеској се и пољопривреда организује на капиталистички начин. За сукнарство је требало много вуне, па крупни земљопосједници претварају њиве у пашњаке за овце. Ограђују не само своју, него и општинску земљу и земљу сељака закупаца. Сељаци остају без земље, селе се у градове и постају јефтина радна снага, најамни радници. Томас Мор је то описао ријечима: „Овце су појеле људе!“','вуна · њиве у пашњаке · сељаци у градове · „Овце су појеле људе“'],
['Томас Мор и Утопија','Томас Мор (1477–1535) био је правник и високи службеник на двору Хенрија VIII. Пао је у немилост јер се није сложио са краљевим раскидом са папом, па је затворен и погубљен. Најпознатије дјело му је „Утопија“ (1516). Главна идеја је да је приватна својина узрок свих зала, па у његовом идеалном друштву приватне својине нема.','двор Хенрија VIII · погубљен · „Утопија“ 1516 · без приватне својине'],
['Друштвене промјене','Грађанска класа у 16. вијеку јача. Чине је богати трговци, први мануфактуристи, богати фармери и дио племства који се укључио у нове послове. Држава помаже грађанство јер од мануфактура и прекоморске трговине има приходе. Ипак, племство и даље има повластице: не плаћа порез и држи највише функције. Грађани плаћају највеће порезе, а немају политички утицај, па слиједи борба грађанства за политичка права.','трговци, мануфактуристи, фармери · племство без пореза · грађани без политичке моћи · борба за права']
],
qs:[

['Шта је мануфактура? Када се развила и у чему је њен значај?','Радионица са више радника у којој се ручно ради, али је посао подијељен на операције. Развија се од 15. вијека. Значај: бржа и већа производња, први облик капиталистичке производње.'],
['Како се остваривала првобитна акумулација капитала?','Искоришћавањем радника у мануфактурама, рудара у рудницима и ограђивањем земље у Енглеској.'],
['Које су се друштвене промјене десиле на почетку новог вијека?','Јача грађанска класа (трговци, мануфактуристи, фармери), али племство задржава повластице. Грађани плаћају највеће порезе без политичког утицаја, па почиње њихова борба за политичка права.'],

{
id:'l3', n:3, title:'Хуманизам и ренесанса', pages:'18–21',
start:'Хуманизам и ренесанса су нови културни покрет који је настао у италијанским градовима и проширио се по Европи. Рећи ћу шта значе ти појмови, ко су први хуманисти, шта се дешавало у науци, како се хуманизам ширио ван Италије, а на крају архитектуру, сликарство и вајарство.',
steps:[
['Градови и нови начин мишљења','У средњем вијеку културни центри били су манастири. Онда градови постају привредна и културна средишта и у њима се отварају школе. Богата грађанска класа била је највећи противник феудалних стега. У развијеним италијанским градовима јављају се први мислиоци који иступају против средњовјековног схватања и учења цркве.','манастири → градови · школе · грађани против феудалних стега · Италија'],
['Шта је хуманизам, а шта ренесанса','Вјеровало се да проучавање античких писаца усавршава и оплемењује човјека. То проучавање звали су „човјечанска наука“ и по томе је покрет назван хуманизам. Ренесанса значи препород, тј. обнову античке културе. Почели су у италијанским градовима (Фиренца, Рим, Напуљ, Милано, Венеција), а онда се проширили у Француску, Енглеску, Аустрију, Чешку, Угарску, Дубровник и Шпанију. Дијели се на рану ренесансу, кватроченто (15. вијек), и касну, чинквеченто (16. вијек). Заштитници, мецене, били су владари, папе и богати грађани.','„човјечанска наука“ · препород антике · кватроченто и чинквеченто · мецене'],
['Први хуманисти','Данте Алигијери (1265–1321) сматра се претечом хуманизма. На италијанском језику написао је „Божанствену комедију“, пут кроз загробни свијет, у којем му је водич римски пјесник Вергилије. Франческо Петрарка (1304–1374) писао је на латинском, а прославио се сонетима на италијанском посвећеним Лаури; тражио је и преписивао античка дјела. Ђовани Бокачо написао је „Декамерон“, сто прича испричаних за десет дана, у којима исмијава људске слабости, највише свештенства.','Данте: „Божанствена комедија“ · Петрарка: сонети Лаури · Бокачо: „Декамерон“'],
['Наука','Пољски научник Никола Коперник (1473–1543) доказао је да се Земља и остале планете окрећу око Сунца. Црква је забранила његово дјело „О кретањима небеских тијела“, јер је учила да је Земља средиште свемира. Ђордано Бруно (1548–1600) разрадио је Коперниково учење, па га је инквизиција спалила на Цвјетном тргу у Риму. Галилео Галилеј (1564–1642), оснивач савремене астрономије и механике, усавршио је телескоп, открио Јупитерове сателите, пјеге на Сунцу и неравну површину Мјесеца. Инквизиција га је натјерала да се одрекне својих увјерења, али је он наставио да истражује.','Коперник: Земља око Сунца · Бруно спаљен · Галилеј: телескоп, Јупитерови сателити'],
['Хуманизам ван Италије','У Њемачкој је хуманизам највише дао у науци и био претеча реформације. Најпознатији је Еразмо Ротердамски, „краљ хуманиста“, који је у дјелу „Похвала лудости“ разоткрио заблуде католичке хијерархије. У Француској је хуманизам био дворски: Маргарета Наварска написала је сто новела по угледу на Бокача, а Франсоа Рабле у дјелу „Гаргантуа и Пантагруел“ исмијао је феудално друштво. Дубровчанин Марин Држић написао је комедију „Дундо Мароје“.','Еразмо: „Похвала лудости“ · Рабле: „Гаргантуа и Пантагруел“ · Држић: „Дундо Мароје“'],
['Образовање','Мијења се однос према дјеци. Богати трговци и банкари схватају важност образовања, а владари и дио свештенства га се плаше, због утицаја на поданике и ширења јереси. На образовање дјевојака гледало се лоше. Ипак, образовање напредује јер држави требају добри чиновници. На универзитет иду дјеца имућнијих, да студирају медицину, право или да постану свештеници.','трговци и банкари за · владари и свештенство против · требају чиновници'],
['Архитектура','Градитељи желе да се ослободе француског стила, који су из презира назвали готика. Над црквама подижу велике куполе по узору на римски Пантеон. Оснивач стила ране ренесансе био је Филипо Брунелески, а Браманте је ударио темеље цркве Светог Петра у Риму. Наставили су Рафаел и Микеланђело, који је подигао централну куполу, а довршио ју је Бернини колонадама испред цркве.','готика из презира · куполе као Пантеон · Брунелески · Свети Петар: Браманте, Микеланђело, Бернини'],
['Сликарство и вајарство','Умјетници траже идеалне пропорције људског тијела. Усавршени су фреска (сликање на влажном зиду) и сликање уљем. Микеланђело Буонароти (1475–1564) био је вајар, сликар, градитељ и пјесник: статуе Мојсије и Давид, фреска „Страшни суд“ и „Стварање Адама“ у Сикстинској капели. Леонардо да Винчи (1452–1519) био је универзални геније; најпознатији су „Тајна вечера“ и „Мона Лиза“, а покушао је да направи и справу за летење. Рафаел Санти (1483–1520) осликао је папски двор у Ватикану и познат је по мадонама, као „Сикстинска мадона“. Тицијан Вечели (1490–1576) насликао је више од четири хиљаде слика.','Микеланђело: Давид, Сикстинска капела · Леонардо: Мона Лиза, Тајна вечера · Рафаел: мадоне · Тицијан']
],
qs:[
['Шта је хуманизам?','Покрет који проучава античке писце, јер се вјеровало да то усавршава човјека. Назван је по „човјечанској науци“.'],
['Шта значи ренесанса?','Препород, обнова античке културе, прије свега у умјетности.'],
['Ко се сматра претечом хуманизма и зашто?','Данте Алигијери, јер је поштовао античку културу и на италијанском написао „Божанствену комедију“, са Вергилијем као водичем.'],
['Шта је открио Коперник и како је реаговала црква?','Да се Земља и планете окрећу око Сунца. Црква је забранила његово дјело јер је учила да је Земља средиште свемира.'],
['Шта се десило Ђордану Бруну и Галилеју?','Бруна је инквизиција спалила у Риму 1600. Галилеја је натјерала да се одрекне увјерења.'],

['Наведи велике сликаре ренесансе и њихова дјела.','Микеланђело (Давид, Мојсије, Сикстинска капела), Леонардо да Винчи (Мона Лиза, Тајна вечера), Рафаел (Сикстинска мадона), Тицијан (преко 4 000 слика).'],

{
id:'l4', n:4, title:'Реформација и контрареформација', pages:'22–26',
start:'Реформација је вјерски, али и друштвено-политички покрет 16. вијека, који је подијелио западну цркву. Почећу од узрока, затим Мартин Лутер, сељачки устанак, ширење реформације, Цвингли и Калвин, а на крају контрареформација и вјерски ратови.',
steps:[
['Узроци реформације','Нова знања, развој привреде и трговине јачали су богато грађанство, које је тражило своје мјесто у феудалном друштву, па и у цркви. Што је хуманизам значио за образовање, а ренесанса за умјетност, то је реформација значила за вјеру. Али док су хуманизам и ренесанса захватили узак круг образованих, реформација је потресла цијело друштво. Католичка црква није уклонила узроке незадовољства: старјешине су се богатиле, а свештеничка звања су се злоупотребљавала.','грађанство јача · захватила цијело друштво · богаћење старјешина · злоупотребе'],
['Мартин Лутер и 95 теза','Мартин Лутер (1483–1546), син рудара, монах и професор у Витембергу, видио је у Риму како раскошно живи папски двор. Повод за раскид била је продаја опроштајница, које су наводно за новац праштале гријехе. Године 1517. прикуцао је 95 теза на врата цркве у Витембергу и оспорио опроштајнице, а онда и папску непогрешивост. Учио је да је Свето писмо извор истине и превео га на њемачки језик, док га је штитио саски кнез Фридрих Мудри.','опроштајнице · 1517, 95 теза, Витемберг · Свето писмо на њемачком · Фридрих Мудри'],
['Раскид са Римом','Рим је прогласио његове тезе јересом. Лутер је искључен из цркве, а 1520. јавно је спалио папску булу. Цар Карло V позвао га је на сабор у Вормсу 1521. да опозове учење, али Лутер је одбио, па су он и његови списи осуђени. Ипак, цар није ревносно прогонио протестанте, јер је ратовао са папом, а многи кнезови су прихватили реформацију. На сабору у Шпајеру 1526. дозвољено је да сваки члан сабора остане у вјери коју изабере. У новој цркви кнез управља црквом, а свештеници (пастори) могу да имају породицу.','1520. спаљена була · 1521. Вормс · Карло V · 1526. Шпајер · пастори без целибата'],
['Сељачки устанак','Сељаци су Лутерову „јеванђељску слободу“ схватили као борбу за своја права. Палили су замкове и манастире и тражили да се држава преуреди, да главну улогу имају грађани и сељаци. Најрадикалнији су били анабаптисти, које је водио Тома Минцер (1489–1525); хтио је „хиљадугодишње царство божје“, друштво без класа и са једнакошћу. Сељаци нису били уједињени, а Лутер је стао против њих, па је устанак угушен у мају 1525. године, а вође погубљене.','„јеванђељска слобода“ · анабаптисти · Тома Минцер · угушен 1525'],
['Ширење реформације, Аугсбург','Кнезови су прихватили Лутера, јер је тражио јефтину цркву и јачао власт кнезова. Када је други сабор у Шпајеру 1529. укинуо слободу избора вјере, лутерански кнезови и градови су протестовали, па се покрет назива протестантизам. Ратови и сукоби завршени су компромисом у Аугсбургу 1555. године: „Cuius regio, illius religio“, чија је земља, његова је и вјера. Поданици су имали вјеру свог кнеза.','1529. протест → протестантизам · 1555. Аугсбург · чија је земља, његова је и вјера'],
['Цвингли и Калвин','У Швајцарској су се јавиле двије варијанте. Урлих Цвингли (1484–1531) у Цириху уклонио је иконе и оргуље из цркве и одбацио учење да се хљеб и вино при причешћу претварају у тијело и крв Христову. Жан Калвин (1509–1564) у Женеви учио је предестинацију: Бог унапријед одређује ко ће бити спасен, а човјек треба да живи као да је изабран. Калвин је завео вјерски терор: забрањивао је позориште, игре и свечаности. Калвинизам се проширио у Француску (хугеноти), Холандију и Енглеску.','Цвингли, Цирих · Калвин, Женева · предестинација · хугеноти'],
['Контрареформација и језуити','Контрареформација је одговор Католичке цркве на реформацију. Најјачи ослонац папе био је нови ред Друштво Исусово, језуити, који је 1540. основао шпански племић Игнације Лојола (1491–1556). Језуити нису живјели у манастирима, него су радили као учитељи, исповједници и савјетници на дворовима, да бране католичку вјеру у свим слојевима. Приписује им се начело „циљ оправдава средства“.','Друштво Исусово · Игнације Лојола, 1540 · „циљ оправдава средства“'],
['Инквизиција и Тридентски концил','Кардинал Карафа основао је 1542. римску инквизицију по узору на шпанску, а као папа Павле IV увео је Индекс забрањених књига, које су спаљиване. Најважнији је био Тридентски концил (1545–1563): осудио је протестантско учење, потврдио неоспорну власт папе и целибат свештеника. До помирења није дошло, али је ширење протестантизма заустављено, а у неким земљама (Француска, Аустрија) био је потпуно искоријењен.','римска инквизиција 1542 · Индекс забрањених књига · Тридентски концил 1545–1563'],
['Вјерски ратови','Мир из 1555. донио је само привремено затишје, па је почетком 17. вијека избио Тридесетогодишњи рат (1618–1648), у којем су њемачке земље тешко страдале. У Француској су калвинисти, хугеноти, жестоко прогањани. Најстрашнији догађај била је Вартоломејска ноћ (23/24. августа 1572), када је само у Паризу убијено око 4 000 хугенота. Ратови су стали крајем 16. вијека, када им је краљ Анри IV, и сам бивши хугенот, дозволио богослужење у неким градовима и стотинак утврђених мјеста.','Тридесетогодишњи рат 1618–1648 · Вартоломејска ноћ 1572 · Анри IV']
],
qs:[
['Која је била улога Католичке цркве у средњем вијеку?','Имала је огромну власт и богатство и контролисала образовање и вјерски живот. Старјешине су се богатиле, а звања су се злоупотребљавала, што је стварало незадовољство.'],
['Шта је основни узрок појаве реформације?','Незадовољство злоупотребама цркве (богаћење, продаја опроштајница) и жеља ојачалог грађанства за промјенама.'],
['Зашто је реформација из вјерског прерасла у широки друштвени и политички покрет?','Јер је захватила све слојеве: кнезови су јачали власт, а сељаци су подигли устанак за своја права. Борило се и за промјену цијелог друштвеног поретка.'],
['Који су резултати реформаторског покрета у Њемачкој и осталим дијеловима Европе?','У Њемачкој Аугсбуршки мир 1555: чија је земља, његова је и вјера. Настају лутерани, калвинисти (Швајцарска, Француска, Холандија, Енглеска), а западна црква је подијељена.'],
['Шта је контрареформација и у чему је њен значај?','Одговор Католичке цркве: језуити, инквизиција, Индекс забрањених књига и Тридентски концил. Зауставила је ширење протестантизма и обновила католичку цркву.'],
['Шта су опроштајнице?','Папире које је црква продавала за новац, а наводно су праштали гријехе.'],

['Шта је Вартоломејска ноћ?','Покољ хугенота у Паризу 23/24. августа 1572, убијено око 4 000 људи.']

{
id:'l5', n:5, title:'Шпанија и револуција у Холандији', pages:'27–29',
start:'У 16. вијеку Шпанија је највећа сила, под Карлом V и Филипом II, а Холандија се против ње побунила и изборила независност. Прво ћу рећи нешто о царству Карла V, затим о Филипу II, па о узроцима, току и значају холандске револуције.',
steps:[
['Царство Карла V','Титула цара Светог римског царства њемачког народа била је изборна, а од 1438. цареви су из породице Хабзбург. Почетком 16. вијека влада Карло V (1519–1556). Његова држава обухватала је Шпанију, Холандију, Белгију, Луксембург, Њемачку, Аустрију, Чешку, Мађарску, Хрватску, сјеверну Африку и велики дио Америке. Карло се одрекао власти и подијелио државу: син Филип II добио је Шпанију, Холандију и посједе у Италији и Америци (шпански огранак), а брат Аустрију, Угарску и Чешку (аустријски огранак).','Хабзбурзи од 1438 · Карло V 1519–1556 · подјела: шпански и аустријски огранак',1],
['Филип II и Шпанија','Филип II (1556–1598) је зачетник апсолутизма у Шпанији. Био је ватрени католик и хтио је јединствену католичку Шпанију, па је дао велику власт инквизицији. Маврима је наредио да пређу у католичку вјеру и забранио им арапски језик, обичаје и ношњу; њихова побуна 1568. сурово је угушена. Године 1580. припојио је Португал.','зачетник апсолутизма · инквизиција · Маври, 1568 · Португал 1580'],
['Лепанто и Велика армада','Филипов полубрат Дон Хуан (Хуан од Аустрије) поразио је турску флоту код Лепанта 1571. године. Филип је онда кренуо на Енглеску, јер је помагала протестанте, а као повод навео је погубљење шкотске краљице Марије Стјуарт. Велика армада кренула је 1588, али је доживјела пораз у Ламаншу и шпанска морнарица се од тога није опоравила.','Лепанто 1571 · Марија Стјуарт · армада 1588, Ламанш'],
['Узроци холандске револуције','Холандске провинције, њих седамнаест, биле су најразвијенији дио Филипове државе. Биле су католичке и протестантске, имале су аутономију, а управљао је штатхолдер, краљев намјесник. Филип је угрозио њихову слободу: постављао је бискупе, повећавао порезе и тражио да свуда буде католичанство, а протестанте је сматрао невјерницима. Зато се 1565. оснива лига коју воде протестанти и избија устанак.','17 провинција · штатхолдер · порези, бискупи, католичанство · лига 1565'],
['Војвода од Албе и ток устанка','Филип шаље војводу од Албе, који заводи терор и суд назван Крвави савјет; 12 000 људи осуђено је због побуне. Зато се 1572. католици и протестанти уједињују, а вођа побуне постаје Виљем Орански. Шпанија финансијски слаби. Године 1579. јужне провинције оснивају Араску (католичку) унију и признају Филипа, а сјеверне Утрехтску унију, са циљем да оснују независну државу.','Крвави савјет · Виљем Орански · 1579: Араска и Утрехтска унија'],
['Независност','Сјеверне провинције прогласиле су независност 1581. године и добиле име по највећој провинцији, Холандија. Виљем Орански убијен је 1584, али је његов син наставио борбу. Филип је изгубио ратове против Енглеске и Француске, а Холандија је међународно призната Вестфалским миром 1648. године.','1581. независност · 1584. убијен Виљем · 1648. Вестфалски мир'],
['Уређење и значај Холандије','Холандија је постала република: народ је извор власти, а владар служи народу. Највиши орган била је Скупштина сталежа. То је прва револуција и прва нововјековна република, прва држава у којој је грађанство побиједило апсолутизам и феудализам. Холандија постаје свјетска поморска сила и оснива колоније, међу њима Нови Амстердам (данас Њујорк), и Холандску источноиндијску компанију (1602). Амстердам постаје трговачки и банкарски центар.','република · прва револуција · Нови Амстердам · компанија 1602 · Амстердам']
],
qs:[
['Наведите основне карактеристике развоја Шпаније у 16. вијеку.','Под Филипом II почиње апсолутизам, јача католичанство и инквизиција, прогоне се Маври, припојен је Португал, побједа код Лепанта 1571, а пораз армаде 1588. ослабио је Шпанију.'],
['Који су узроци избијања револуције у Холандији?','Филип II је укидао аутономију, повећавао порезе, постављао бискупе и наметао католичанство протестантима.'],
['Како је настала Холандија?','После устанка, сјеверне провинције основале су Утрехтску унију 1579, прогласиле независност 1581, а признате су Вестфалским миром 1648.'],
['У чему је историјски значај револуције у Холандији?','То је прва револуција и прва нововјековна република, у којој је грађанство побиједило апсолутизам и феудализам.'],
['Ко је био Виљем Орански?','Вођа холандске побуне и насљедни штатхолдер сјеверних провинција, убијен 1584.'],

{
id:'l6', n:6, title:'Француска апсолутистичка монархија', pages:'30–31',
start:'Француска је у 16. вијеку била ослабљена вјерским ратовима, а у 17. вијеку постала је најјача апсолутистичка монархија. Говорићу о вјерским ратовима и Вартоломејској ноћи, о доласку Бурбона и Анрију IV, о Лују XIII и Ришељеу, и на крају о Лују XIV, врхунцу апсолутизма.',
steps:[
['Француска у 16. вијеку','Француска је у нови вијек ушла ослабљена вјерским грађанским ратовима. На престолу су се смјенила три брата, Франсоа II, Шарл IX и Анри III, посљедњи владари из династије Валоа. Краљева власт била је слаба, а у име синова државом је управљала њихова мајка Катарина Медичи.','вјерски ратови · три брата · Валоа · Катарина Медичи'],
['Вартоломејска ноћ','Да би зауставила сукобе католика и хугенота, Катарина је испланирала брак Маргарете Валоа и Анрија Наварског, вође хугенота. Умјесто свадбе, 24. августа 1572. десио се покољ хугенота у Паризу, назван Вартоломејска ноћ или Крвава париска свадба. Убијено је око 4 000 хугенота, а покољи су се проширили по цијелој Француској.','свадба Маргарете и Анрија · 24. 8. 1572 · 4 000 хугенота'],
['Анри IV и Бурбони','Анри III прогласио је Анрија Наварског за насљедника, ако пређе у католичку вјеру, и он је то прихватио. Владар је постао 1589, а крунисан је 1594, чиме на власт долази династија Бурбона. Нантским едиктом 1598. увео је вјерску толеранцију. Слиједи мир: јачају привреда и трговина, почиње насељавање Канаде, оснива се Источноиндијска компанија. Француска побјеђује Шпанију и шири се. Анри IV убијен је 1610. године.','1589 владар · Бурбони · Нантски едикт 1598 · Канада · убијен 1610'],
['Луј XIII и Ришеље','Насљедник је малољетни Луј XIII (1610–1643), у чије име влада мајка Марија Медичи. Године 1614. сазвана је скупштина сталежа, посљедња прије Француске револуције. Кардинал Ришеље постаје краљев први савјетник (1624–1642). Јачао је краљеву власт, гушио побуне, смањивао моћ племства и одузео Парламенту право да даје примједбе на краљеве законе. Угушио је побуну хугенота 1628. и заузео Ла Рошел, али је 1629. издао Алески едикт милости, којим су хугеноти задржали вјерску слободу.','Марија Медичи · 1614 скупштина сталежа · Ришеље 1624–1642 · Ла Рошел · Алески едикт 1629'],
['Луј XIV: „Држава то сам ја“','Апсолутизам доживљава врхунац под Лујем XIV (1643–1715), владаром са најдужим стажом. На власт је дошао са пет година, а умјесто њега владали су мајка Ана Аустријска и кардинал Мазарен. Након Мазаренове смрти Луј је рекао да ће сам себи бити први министар, па му се приписује изрека „Држава то сам ја“. То вријеме зове се и „вијек Луја XIV“.','1643–1715 · Ана Аустријска и Мазарен · „Држава то сам ја“'],
['Колбер и меркантилизам','Луј је знао да бира способне министре. Финансије је водио Жан Батист Колбер: јачао је домаћу производњу, смањивао увоз и повећавао извоз. Та политика, по којој је трговина главни извор богатства, зове се меркантилизам, а у Француској колбертизам. Остали министри: Лион за спољне послове, Лувоа државни секретар, Телије министар рата и Вобан за градњу тврђава.','Колбер · мање увоза, више извоза · меркантилизам, колбертизам'],
['Култура, ратови и крај','На свом двору окупљао је књижевнике, умјетнике и научнике. Изграђени су Версај, Лувр, Библиотека, Звјездара и Дом инвалида. Водио је четири неуспјешна рата и добио мало: дио Алзаса, дио Фландрије, Франш Конте и Стразбур. Насљедио га је унук Луј XV, када почиње криза: грађанство и сељаци плаћају порезе, а племство троши иако је каса празна. Та политика водила је Француску ка револуцији.','Версај, Лувр · четири рата · Луј XV, криза · ка револуцији']
],
qs:[
['Шта је Вартоломејска ноћ?','Покољ хугенота у Паризу 24. августа 1572, умјесто свадбе Маргарете Валоа и Анрија Наварског. Убијено је око 4 000 хугенота.'],
['Како су Бурбони дошли на власт?','Анри III је прогласио Анрија Наварског за насљедника ако пређе у католичанство. Постао је краљ 1589. (Анри IV) и започео династију Бурбона.'],
['Шта је Нантски едикт?','Документ Анрија IV из 1598. којим је уведена вјерска толеранција.'],
['Шта је радио кардинал Ришеље?','Јачао краљеву власт, гушио побуне, смањивао моћ племства и Парламента, угушио хугеноте у Ла Рошелу и издао Алески едикт милости.'],
['Зашто је владавина Луја XIV врхунац апсолутизма?','Владао је сам, без првог министра („Држава то сам ја“), најдуже од свих, уз јаку привреду и културу.'],
['Шта је меркантилизам?','Политика јачања домаће производње, малог увоза и што већег извоза; у Француској колбертизам.'],
['Зашто Француска улази у кризу под Лујем XV?','Грађани и сељаци плаћају порезе, а племство троши иако је каса празна. То води ка револуцији.']

{
id:'l7', n:7, title:'Русија у XVI и XVII вијеку', pages:'33–34',
start:'У 16. и 17. вијеку Русија се ослобађа Татара, шири се и јача апсолутизам. Говорићу о Ивану IV Грозном, о времену великих смутњи, о првим Романовима и на крају о руском друштву.',
steps:[
['Ослобођење од Татара','Московска велика кнежевина коначно се 1480. године ослободила татарског јарма. Њени владари, насљедници Ивана III, кренули су у ширење територије.','1480 · татарски јарам · Иван III'],
['Иван IV: први, успјешни дио','Иван IV (1533–1584) први је, уз ширење територије, јачао владарски апсолутизам. Његову владавину дијелимо на два дијела. У првом је провео реформе државног и црквеног законодавства, Москва постаје центар свјетовне и духовне власти, оснива се штампарија. Јачао је везе са Западом: у Русију се насељавају Нијемци, Швеђани, Холанђани и Енглези, а 1584. отворена је лука Архангелск. Реформисао је војску и основао стријелце. Године 1547. узео је титулу цара.','реформе · штампарија · странци · Архангелск 1584 · стријелци · цар 1547'],
['Ширење Русије','Када је Иван дошао на власт, Русија се простирала од Смоленска до Урала, а он је скоро удвостручио територију. Припојио је земље уз ријеке Дон и Волгу, а преко Урала Руси улазе у Сибир и оснивају Тоболск (1587).','Смоленск до Урала · Дон и Волга · Сибир, Тоболск 1587'],
['Иван Грозни и опричнина','Други дио владавине запамћен је по суровости, па је добио надимак Грозни. Водио је крваве обрачуне са бољарима, крупним племством. Године 1565. основао је опричнину, дио државе под својом строгом контролом; остатак, земштина, припао је бољарима. Опричници, царева гарда, хватали су и убијали бољаре, а њихове посједе цар је дијелио опричницима. Када је моћ бољара сломљена, опричнина је укинута.','Грозни · бољари · опричнина 1565 · земштина · опричници'],
['Велике смутње','Од смрти Ивана IV до 1613. у Русији је немирно вријеме. Влада син Фјодор (1584–1598), а онда његов шурјак Борис Годунов (1598–1605), оптужен за смрт царевића Димитрија. Мијешају се Пољаци и Швеђани, у Пољској се појављује човјек који тврди да је Димитрије, а Пољаци заузимају Москву. Великим народним покретом Русија се ослобађа 1612, а 1613. за цара је изабран Михаило Фјодорович Романов. Романови владају до 1917. године.','Фјодор · Борис Годунов · лажни Димитрије · Пољаци у Москви · 1613. Романови'],
['Први Романови','Михаило Романов (1613–1645) био је из реда бољара, а отац му је био митрополит. Његова политика имала је три правца: независност Русије, јачање вјере и увођење европске културе. Отвара се прва фабрика оружја у Тули, развија се трговина дрветом и крзном, а цар врши први попис становништва. Његов насљедник Алексеј (1645–1676) наређује кодификацију руског права и ратује са Пољском због Украјине; миром 1667. Пољска признаје Русији Украјину источно од Дњепра. Средином 17. вијека освојен је Сибир и Русија постаје територијално највећа држава на свијету.','Михаило: три правца, Тула, попис · Алексеј: право, Украјина 1667 · највећа држава'],
['Руско друштво','Русија је у односу на Запад била заостала. Сељаци су имали најтежи положај и бјежали су на „пуста поља“, гдје су постајали козаци. Феудалци су их везивали за земљу; кметови су звани „крепосници“ и за њих је важило крепосно право. Привреда је била неразвијена, а грађанска класа малобројна и без права, све до реформи Петра Великог почетком 18. вијека.','заостала · козаци · крепосно право · Петар Велики']
],
qs:[
['Наведите најважније догађаје из времена владавине Ивана IV.','Реформе, штампарија, везе са Западом, стријелци, титула цара 1547, удвостручена територија (Дон, Волга, Сибир), опричнина 1565. и обрачун са бољарима.'],
['Шта је вријеме „великих смутњи“ и какве су опасности тада пријетиле Русији?','Немирно вријеме од смрти Ивана IV до 1613: борбе за престо (Годунов, лажни Димитрије), мијешање Пољака и Швеђана, Пољаци заузели Москву. Пријетио је губитак независности.'],
['Опиши владавину првих владара из династије Романов.','Михаило (1613–1645): независност, вјера, европска култура, фабрика у Тули, попис. Алексеј (1645–1676): закони, рат са Пољском, Украјина источно од Дњепра 1667.'],
['Шта је опричнина?','Дио државе под строгом контролом Ивана Грозног (1565), у којем су опричници уништавали бољаре.'],
['Ко су били бољари, а ко козаци?','Бољари су руско крупно племство. Козаци су сељаци који су бјежали на „пуста поља“ на граници.']
],

{
id:'l8', n:8, title:'Енглеска у XVI и XVII вијеку', pages:'36–39',
start:'У 16. и 17. вијеку Енглеска пролази кроз апсолутизам, вјерске борбе, Елизабетино златно доба, грађански рат, републику и Славну револуцију, а на крају побјеђује Парламент и настаје парламентарна монархија. Ићи ћу редом, од Тјудора до Славне револуције.',
steps:[
['Тјудори и Хенри VII','Након Рата ружа 1485. на власт долази династија Тјудор, коју почиње Хенри VII (1485–1509). Он јача краљеву власт: оснива Звјездани дом, суд који је могао судити племићима без пороте, а ослања се на ниже племство и грађанство.','Рат ружа 1485 · Тјудори · Звјездани дом'],
['Хенри VIII и раскид са папом','Хенри VIII (1509–1547) био је први апсолутиста у Енглеској. У почетку је био против реформације и писао је против Лутера, па му је папа дао назив „Бранилац вјере“. Сукоб је почео лично: папа није хтио да га разведе од Катарине Арагонске. Хенри је сам раскинуо брак и оженио се Аном Болен, а Парламент је 1534. донио Закон о супремацији, по којем је краљ врховни поглавар цркве. Тако настаје Англиканска црква, а посједи Католичке цркве се одузимају.','„Бранилац вјере“ · развод · Закон о супремацији 1534 · Англиканска црква'],
['Англиканска црква и Хенријеве жене','Англиканска црква узела је дио Лутеровог учења, од Калвина учење о причешћу, а из католичанства власт свештеника. Куповином одузете црквене земље настаје ново племство. Хенри је запамћен по шест бракова: са Катарином Арагонском има кћерку Мери, са Аном Болен будућу краљицу Елизабету (Ану је погубио), са Џејн Сејмур сина Едварда; погубио је и Кетрин Ховард, а посљедња жена, Катарина Пар, га је надживјела.','Лутер + Калвин + католичанство · ново племство · шест жена'],
['Крвава Мери','После кратке владавине Едварда VI (1547–1553) влада Марија Тјудор (1553–1558), Хенријева кћерка из првог брака, васпитана као католкиња. Покушала је да врати католичанство и прогонила је англиканце, па је добила надимак „Крвава Мери“.','Едвард VI · Марија Тјудор 1553–1558 · враћа католичанство'],
['Елизабетанско доба','Елизабета I (1558–1603), кћерка Ане Болен, владала је дуго и успјешно. Законом од 39 чланова трајно је уредила цркву: богослужење на народном језику и протестантско учење, али католички сјај обреда, а на врху цркве краљ. Енглеска постаје велика поморска сила: 1588. флота коју води Френсис Дрејк побјеђује шпанску Непобједиву армаду. Помагала је Холандију против Шпаније и слагала се са Парламентом, а шкотску краљицу Марију Стјуарт држала је у заточеништву и погубила. Говорила је шест језика, а у њено вријеме стварају Френсис Бекон и Виљем Шекспир. То је златно елизабетанско доба.','39 чланова · армада 1588, Дрејк · Марија Стјуарт · Шекспир · златно доба'],
['Стјуарти и сукоб са Парламентом','Елизабета није имала дјеце, па власт прелази на Џејмса Стјуарта (1603–1625), сина Марије Стјуарт. Ново племство жели да ослаби краљев апсолутизам, а краљ не може уводити намете без Парламента. Сукоб се заоштрава под Чарлсом I (1625–1649), који скупља новац без Парламента. Парламент 1628. изгласава Петицију о правима; краљ је прихвата, али је не поштује и 11 година влада апсолутистички. Године 1640. сазива па распушта Парламент, али посланици одбијају да се разиђу: почиње револуција и Дуги парламент (1640–1660).','Џејмс I · Чарлс I · Петиција о правима 1628 · Дуги парламент 1640'],
['Грађански рат и погубљење краља','Грађански рат почиње 1642. Краља подржава крупно племство (запад и сјевер), а Парламент ниже племство и грађанство (југ и исток). Војску Парламента организује Оливер Кромвел, ситни племић, и она побјеђује. Када је краљ заробљен, Кромвел сазива Крњи парламент, који осуђује краља као издајника. Чарлс I погубљен је 30. јануара 1649, монархија је укинута и проглашена је република.','1642 рат · Кромвел · Крњи парламент · 30. 1. 1649. погубљен краљ · република'],
['Кромвелов режим','Кромвел управља Енглеском од 1649. до смрти 1658. Поразио је Ирску и Шкотску и 1651. прогласио њихову унију са Енглеском, тако настаје Велика Британија. Исте године донио је Навигациони акт: робу у Британију смију увозити само британски бродови. Ратовао је успјешно против Шпаније, Португала и Холандије и добио Денкерк и Јамајку. Ипак, распустио је Крњи парламент и узео титулу лорд протектор. После његове смрти јачају они који желе обнову монархије.','Ирска и Шкотска · Навигациони акт 1651 · Јамајка · лорд протектор'],
['Рестаурација','Године 1660. враћају се Стјуарти: краљ постаје Чарлс II (1660–1685). Кажњава оне који су убили његовог оца и тежи апсолутизму, али поштује Парламент. Пошто је јачао католике, Парламент 1673. доноси закон да државне и војне службе могу имати само англиканци, а 1679. Habeas Corpus Act, који штити људе од самовољног хапшења. Настају прве политичке групе: торијевци, присталице краља, и виговци, противници краља.','Чарлс II 1660 · 1673 само англиканци · Habeas Corpus 1679 · торијевци и виговци'],
['Славна револуција','Џејмс II (1685–1688) отворено враћа католичанство и језуите. Виговци и торијевци се удружују и позивају његовог зета Виљема Оранског и кћерку Марију да преузму власт, а Џејмс бјежи у Француску. То је „Славна револуција“ 1688. Парламент 1689. доноси Декларацију о правима, која постаје Закон о правима: краљ сазива Парламент сваке четири године и бира владу из парламентарне већине, а само Парламент доноси законе, одобрава порезе и војску. Почиње парламентарна монархија. Године 1707. Енглеска и Шкотска се трајно уједињују, а Енглеска постаје најразвијенија и најбоље уређена држава Европе.','Џејмс II · Виљем Орански и Марија · 1688 · Закон о правима 1689 · парламентарна монархија']
],
qs:[

steps:[
['Хабзбуршка монархија','Аустрија је била држава са много народа и различитих територија, којом су владали Хабзбурзи, па се звала Хабзбуршка монархија. Чинили су је аустријске насљедне земље (Штајерска, Корушка, Крањска), Угарска и Чешка, Миланско војводство, Сардинија, Напуљ, Тоскана, аустријска Холандија и Ердељ. Свака провинција имала је своје законе, што је успоравало јачање апсолутизма. Аустрија је водила успјешне ратове против Османлија.','много народа · Хабзбурзи · свака провинција свој закон · ратови са Османлијама'],
['Прагматична санкција','Карло VI (1711–1740) није имао мушког насљедника, па је Прагматичном санкцијом (19. 4. 1713) осигурао престо и за женске насљеднике. Тако га је насљедила кћерка Марија Терезија.','Карло VI · Прагматична санкција 1713 · Марија Терезија'],
['Реформе Марије Терезије','Марија Терезија (1740–1780) уводи просвијећени апсолутизам. Угарској оставља аутономију, али сабори Аустрије и Чешке више не одлучују о порезима. Увела је обавезне порезе за свештенство и племство, основала Дворску и државну канцеларију за спољну политику, Високи савјет за финансије и Врховни суд (1749). Војску је реформисала по пруском узору и основала Војну академију у Винернојштату. Аграрном реформом ограничила је кулук на три дана, а урбарима одредила обавезе сељака. Водила је меркантилистичку политику, оснивала основне школе и ограничавала утицај цркве; у Бечу је основала Терезијанум.','порез за племство и свештенство · Врховни суд 1749 · Војна академија · кулук 3 дана · основне школе'],
['Ратови са Пруском','У спољној политици није имала много успјеха. У рату за аустријско насљеђе (1740–1748) сачувала је све осим Шлезије. У Седмогодишњем рату (1756–1763) покушала је да је врати, али Шлезија је остала Пруској. Од 1765. савладар јој је био син Јосиф II.','рат за аустријско насљеђе · Шлезија · Седмогодишњи рат · Јосиф II савладар 1765'],

<script>
const EXAM_DATE = new Date(2026, 10, 2, 8, 0); // понедјељак, 2. новембар

/* Ћирилица → латиница */
const MAP = {'А':'A','Б':'B','В':'V','Г':'G','Д':'D','Ђ':'Đ','Е':'E','Ж':'Ž','З':'Z','И':'I','Ј':'J','К':'K','Л':'L','Љ':'Lj','М':'M','Н':'N','Њ':'Nj','О':'O','П':'P','Р':'R','С':'S','Т':'T','Ћ':'Ć','У':'U','Ф':'F','Х':'H','Ц':'C','Ч':'Č','Џ':'Dž','Ш':'Š',
'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'đ','е':'e','ж':'ž','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'ć','у':'u','ф':'f','х':'h','ц':'c','ч':'č','џ':'dž','ш':'š'};
function lat(s){
  let out='';
  for (let i=0;i<s.length;i++){
    const c=s[i], m=MAP[c];
    if (!m){ out+=c; continue; }
    if (m.length===2 && c===c.toUpperCase()){
      const nx=s[i+1]; out += (nx && MAP[nx] && nx===nx.toUpperCase() && nx!==nx.toLowerCase()) ? m.toUpperCase() : m;
    } else out+=m;
  }
  return out;
}
const T = s => S.script==='lat' ? lat(s) : s;

const app = document.getElementById('app');
let view = {name:'home'};
let timerId = null;

function go(v){ view = v; if (timerId){ clearInterval(timerId); timerId=null; } render(); window.scrollTo(0,0); }
function L(id){ return LESSONS.find(l=>l.id===id); }
function short(l){ return l.short || l.title; }
function rating(l,i){ return S.r[l.id+'-'+i]; }
function lessonPct(l){
  let s=0; l.steps.forEach((_,i)=>{ const r=rating(l,i); if(r===2)s+=1; else if(r===1)s+=.5; });
  return Math.round(100*s/l.steps.length);
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  h += '<div class="card"><h3>План до понедјељка</h3><p class="small muted" style="margin:0">'+when+'</p><ol class="plan small" style="padding-left:1.2em;margin:8px 0 0">'+
       '<li><b>Субота:</b> лекције 1–3. За сваку прво „Учи“, па „Испричај“.</li>'+

  h += '<h2>Лекције</h2>';
  LESSONS.forEach(l=>{
    const p=lessonPct(l);
    h += '<button class="lesson" data-act="open" data-id="'+l.id+'"><span class="num">'+l.n+'</span><span style="flex:1"><span class="t">'+l.title+'</span><br><span class="small muted">стр. '+l.pages+'</span>'+
      (l.mark?' <span class="mk">'+l.mark+'</span>':'')+(l.partial?' <span class="small muted">· непотпуна</span>':'')+
      '<span class="meter" aria-hidden="true"><i style="width:'+p+'%"></i></span><span class="small muted">'+(p?('Знаш '+p+'%'):'Још није вјежбано')+'</span></span></button>';
  });
  if (S.exams.length){
    h += '<h2>Вјежбе испита</h2><div class="card">';
    S.exams.slice(-5).reverse().forEach(e=>{ const l=L(e.l); h+='<div class="small" style="padding:4px 0">'+short(l)+' · <b>'+e.got+'/'+e.of+'</b> тачака · '+fmt(e.t)+'</div>'; });
    h += '</div>';
  }
  h += '<p class="small muted" style="margin-top:24px">Све се памти у овом прегледачу на овом телефону. <button class="back small" data-act="reset">Обриши напредак</button></p>';
  return h;
}

/* ---------- Лекција ---------- */
function lesson(){
  const l=L(view.id); const tab=view.tab||'learn';
  let h='<button class="back" data-act="home">← Све лекције</button><h2>'+l.n+'. '+l.title+'</h2><p class="small muted" style="margin:0">Књига, стр. '+l.pages+(l.mark?' · <span class="mk">'+l.mark+'</span>':'')+'</p>';
  if (l.partial) h+='<div class="card note small">'+l.partial+'. Оно што слиједи након Патента о толеранцији није овдје.</div>';
  const tabs=[['learn','Учи'],['tell','Испричај'],['qs','Питања'],['dates','Датуми']];
  h+='<div class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" aria-selected="'+(t[0]===tab)+'" data-act="tab" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if (tab==='learn'){
    h+='<div class="card start"><span class="small muted"><b>Како да почнеш</b> (прва реченица кад те прозову)</span><p>„'+l.start+'“</p></div>';
    h+='<div class="card"><h3>Редослијед причања</h3><p class="small muted" style="margin:0">Научи прво овај костур. Ако знаш редослијед, не можеш се изгубити.</p><ol class="skel">'+l.steps.map(s=>'<li>'+s[0]+'</li>').join('')+'</ol></div>';
    l.steps.forEach((s,i)=>{
      const r=rating(l,i);
      h+='<div class="card step"><div class="head"><span class="num">'+(i+1)+'</span><h3>'+(s[3]?'<span class="mk" style="font-size:inherit;white-space:normal">'+s[0]+'</span>':s[0])+'</h3><span class="dot '+(r===undefined?'':'s'+r)+'" title="'+(r===2?'знам':r===1?'дјелимично':r===0?'заборавила':'није вјежбано')+'"></span></div><p>'+s[1]+'</p>'+chips(s[2])+'</div>';
    });
    h+='<div class="card"><h3>Појмови</h3><dl class="terms">'+l.terms.map(t=>'<dt>'+t[0]+'</dt><dd>'+t[1]+'</dd>').join('')+'</dl></div>';
    h+='<button class="btn primary block" data-act="tab" data-tab="tell">Сад испричај наглас →</button>';
  }
  if (tab==='tell'){
    const weak=l.steps.filter((_,i)=>rating(l,i)!==undefined && rating(l,i)<2).length;
    h+='<div class="card"><h3>Испричај лекцију наглас</h3><p class="muted" style="margin:0 0 12px">Видиш само наслов дијела. Причаш наглас све што знаш, па отвориш текст и искрено оцијениш себе. Наглас, не у себи, јер ће те тако и питати.</p>'+
       '<button class="btn primary block" data-act="tellstart" data-mode="all">Цијела лекција ('+l.steps.length+' дијелова)</button>'+
       (weak?'<div style="height:10px"></div><button class="btn block" data-act="tellstart" data-mode="weak">Само оно што није ишло ('+weak+')</button>':'')+'</div>';
  }
  if (tab==='qs') h+=qsView(l);
  if (tab==='dates') h+=datesView(l);
  return h;
}

/* ---------- Питања ---------- */
function qsView(l){
  const i=view.qi||0, q=l.qs[i], k=l.id+'-q'+i, st=S.q[k];
  let h='<div class="card"><span class="progress-txt">Питање '+(i+1)+' од '+l.qs.length+(st===1?' · знаш':st===0?' · понови':'')+'</span><p class="big">'+q[0]+'</p>';
  if (!view.show) h+='<p class="hint">Одговори наглас, па погледај.</p><button class="btn primary block" data-act="qshow">Покажи одговор</button>';
  else h+='<div class="answer">'+q[1]+'</div><div class="row" style="margin-top:14px"><button class="btn bad" data-act="qrate" data-v="0">Још не</button><button class="btn good" data-act="qrate" data-v="1">Знала сам</button></div>';
  h+='</div><div class="row"><button class="btn" data-act="qmove" data-d="-1" '+(i===0?'disabled':'')+'>← Претходно</button><button class="btn" data-act="qmove" data-d="1" '+(i===l.qs.length-1?'disabled':'')+'>Сљедеће →</button></div>';
  return h;
}

/* ---------- Датуми ---------- */
function makeQuiz(pool){
  return shuffle(pool).slice(0,Math.min(8,pool.length)).map(d=>{
    const others=shuffle([...new Set(pool.map(x=>x[0]).filter(y=>y!==d[0]))]).slice(0,3);
    return {q:d[1], a:d[0], opts:shuffle([d[0],...others])};
  });
}
function datesView(l){
  if (!view.quiz){ view.quiz=makeQuiz(l.dates); view.qn=0; view.score=0; view.pick=null; }
  return quizHtml();
}
function quizHtml(){
  const z=view.quiz, n=view.qn;
  if (n>=z.length){
    return '<div class="card"><h3>Резултат: '+view.score+' од '+z.length+'</h3><p class="muted">'+(view.score===z.length?'Сви датуми тачни.':'Погледај још једном оне које си промашила, па пробај опет.')+'</p><button class="btn primary block" data-act="qzagain">Опет, други редослијед</button></div>';
  }
  const it=z[n];
  let h='<div class="card"><span class="progress-txt">'+(n+1)+' / '+z.length+' · тачно '+view.score+'</span><p class="big">'+it.q+'</p><p class="hint" style="margin:0">Које године?</p>';
  it.opts.forEach(o=>{
    let c='opt'; if (view.pick!==null){ if(o===it.a)c+=' right'; else if(o===view.pick)c+=' wrong'; }
    h+='<button class="'+c+'" data-act="qzpick" data-o="'+o+'" '+(view.pick!==null?'disabled':'')+'>'+o+'</button>';
  });
  if (view.pick!==null) h+='<button class="btn primary block" data-act="qznext">Даље →</button>';
  return h+'</div>';
}
function dates(){ // сви датуми, са почетне није потребно, али остаје као поглед
  return '<button class="back" data-act="home">← Назад</button><h2>Сви датуми</h2>'+quizHtml();
}

/* ---------- Испричај ---------- */
function tell(){
  const l=L(view.id); const order=view.order; const k=view.k;
  if (k>=order.length){
    const rs=order.map(i=>rating(l,i)); const g=rs.filter(x=>x===2).length, m=rs.filter(x=>x===1).length, b=rs.filter(x=>x===0).length;
    return '<button class="back" data-act="open" data-id="'+l.id+'">← '+short(l)+'</button><div class="card"><h3>Готово</h3><p>Знала: <b>'+g+'</b> · дјелимично: <b>'+m+'</b> · заборавила: <b>'+b+'</b></p>'+
      (m+b?'<button class="btn primary block" data-act="tellstart" data-mode="weak">Понови само слабе дијелове</button><div style="height:10px"></div>':'<p class="muted">Цијела лекција сједи. Сад је испричај још једном без прекида, у вјежби испита.</p>')+
      '<button class="btn block" data-act="drawone" data-id="'+l.id+'">Вјежба испита за ову лекцију</button></div>';
  }
  const i=order[k], s=l.steps[i];
  let h='<button class="back" data-act="open" data-id="'+l.id+'">← '+short(l)+'</button><div class="card"><span class="progress-txt">Дио '+(k+1)+' од '+order.length+'</span>';
  if (k===0 && view.mode==='all') h+='<p class="hint" style="margin:6px 0 0">Почни уводном реченицом: „'+l.start.split('.')[0]+'.“</p>';
  h+='<p class="big">'+(i+1)+'. '+s[0]+'</p>';
  if (!view.show){
    h+='<p class="hint">Причај наглас све што знаш о овом дијелу.</p>';
    h+= view.hint ? chips(s[2]) : '<button class="btn block" data-act="tellhint">Треба ми подсјетник</button>';
    h+='<div style="height:10px"></div><button class="btn primary block" data-act="tellshow">Готова сам, покажи текст</button>';
  } else {
    h+='<div class="answer">'+s[1]+'<div style="height:10px"></div>'+chips(s[2])+'</div><p class="small muted" style="margin:14px 0 6px">Колико си рекла?</p><div class="row"><button class="btn bad" data-act="rate" data-v="0">Заборавила</button><button class="btn mid" data-act="rate" data-v="1">Пола</button><button class="btn good" data-act="rate" data-v="2">Све битно</button></div>';
  }
  return h+'</div>';
}

/* ---------- Вјежба испита ---------- */
function exam(){
  const l=L(view.id);
  if (view.phase==='talk'){
    let h='<button class="back" data-act="home">← Почетна</button><div class="card hero"><span class="small muted">Наставник каже:</span><p class="big">„Причај нам о теми: '+l.title+'.“</p><p class="small muted" style="margin:0">стр. '+l.pages+'</p>';
    h+='<div class="timer" id="timer" aria-live="off">0:00</div><p class="hint" style="text-align:center;margin-top:0">Добра прича траје 3 до 5 минута. Причај наглас, од почетка до краја.</p>';
    h+= view.help ? '<div class="answer small">Почни: „'+l.start+'“</div>' : '<button class="btn block" data-act="examhelp">Не знам како да почнем</button>';
    h+='<div style="height:10px"></div><button class="btn primary block" data-act="examdone">Готова сам</button><div style="height:10px"></div><button class="btn block" data-act="draw">Извуци другу лекцију</button></div>';
    return h;
  }
  if (view.phase==='check'){
    let h='<div class="card"><h3>Шта си споменула?</h3><p class="small muted" style="margin:0 0 6px">Причала си '+fmt(view.secs)+'. Штиклирај дијелове које си стварно рекла.</p>';
    l.steps.forEach((s,i)=>{ h+='<label class="check"><input type="checkbox" id="ck'+i+'" data-i="'+i+'"><span><b>'+(i+1)+'. '+s[0]+'</b><br><span class="small muted">'+s[2]+'</span></span></label>'; });
    return h+'<div style="height:14px"></div><button class="btn primary block" data-act="examscore">Провјери</button></div>';
  }
  // phase result
  const missed=view.missed;
  const q=view.follow;
  let h='<div class="card"><h3>'+view.got+' од '+l.steps.length+' дијелова</h3><p class="muted">'+(view.got===l.steps.length?'Одлично, испричала си цијелу лекцију.':view.got>=l.steps.length*0.7?'Добро. Још мало па савршено.':'Има шта да се понови. Ништа страшно, зато вјежбамо.')+'</p>';
  if (missed.length) h+='<p class="small" style="margin-bottom:4px"><b>Прескочила си:</b></p><ul class="small" style="margin-top:0">'+missed.map(i=>'<li>'+l.steps[i][0]+'</li>').join('')+'</ul>';
  h+='</div><div class="card"><span class="small muted">Наставник још пита:</span><p class="big" style="font-size:1.25rem">'+q[0]+'</p>'+
     (view.fshow?'<div class="answer">'+q[1]+'</div>':'<button class="btn block" data-act="followshow">Одговори наглас, па покажи</button>')+'</div>';
  h+='<div class="row">'+(missed.length?'<button class="btn" data-act="tellmissed">Понови прескочено</button>':'')+'<button class="btn primary" data-act="draw">Нова лекција</button></div><div style="height:10px"></div><button class="btn block" data-act="home">Почетна</button>';
  return h;
}
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

/* ---------- Догађаји ---------- */
function bind(){
  app.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',e=>act(el.dataset.act, el.dataset)));
  if (view.name==='exam' && view.phase==='talk'){
    const t=document.getElementById('timer');
    const tick=()=>{ view.secs=Math.floor((Date.now()-view.t0)/1000); t.textContent=fmt(view.secs); };
    tick(); timerId=setInterval(tick,1000);
  }
}
function act(a,d){
  const l = view.id ? L(view.id) : null;
  switch(a){
    case 'home': go({name:'home'}); break;
    case 'open': go({name:'lesson', id:d.id, tab:'learn'}); break;
    case 'tab': go({name:'lesson', id:view.id, tab:d.tab}); break;
    case 'draw': {
      let pool=LESSONS.filter(x=>!view.id || LESSONS.length<2 || x.id!==view.id);
      const pick=pool[Math.floor(Math.random()*pool.length)];
      go({name:'exam', id:pick.id, phase:'talk', t0:Date.now(), secs:0}); break; }
    case 'drawone': go({name:'exam', id:d.id, phase:'talk', t0:Date.now(), secs:0}); break;
    case 'examhelp': view.help=true; { const t0=view.t0; render(); view.t0=t0; } break;
    case 'examdone': clearInterval(timerId); timerId=null; view.phase='check'; render(); break;
    case 'examscore': {
      const ticked=[...app.querySelectorAll('input[type=checkbox]')].filter(x=>x.checked).map(x=>+x.dataset.i);
      view.got=ticked.length; view.missed=l.steps.map((_,i)=>i).filter(i=>!ticked.includes(i));
      view.follow=l.qs[Math.floor(Math.random()*l.qs.length)]; view.phase='result'; view.fshow=false;
      S.exams.push({l:l.id, got:view.got, of:l.steps.length, t:view.secs||0}); save(); render(); window.scrollTo(0,0); break; }
    case 'followshow': view.fshow=true; render(); break;
    case 'tellmissed': go({name:'tell', id:view.id, order:view.missed, k:0, mode:'weak'}); break;
    case 'tellstart': {
      let order=l.steps.map((_,i)=>i);
      if (d.mode==='weak') order=order.filter(i=>rating(l,i)!==2);
      if (!order.length) order=l.steps.map((_,i)=>i);
      go({name:'tell', id:l.id, order, k:0, mode:d.mode}); break; }
    case 'tellhint': view.hint=true; render(); break;
    case 'tellshow': view.show=true; render(); break;
    case 'rate': S.r[l.id+'-'+view.order[view.k]]=+d.v; save(); view.k++; view.show=false; view.hint=false; render(); window.scrollTo(0,0); break;
    case 'qshow': view.show=true; render(); break;
    case 'qrate': S.q[l.id+'-q'+(view.qi||0)]=+d.v; save(); if((view.qi||0)<l.qs.length-1){view.qi=(view.qi||0)+1;} view.show=false; render(); break;
    case 'qmove': view.qi=Math.max(0,Math.min(l.qs.length-1,(view.qi||0)+(+d.d))); view.show=false; render(); break;
    case 'qzpick': view.pick=d.o; if(d.o===view.quiz[view.qn].a) view.score++; render(); break;
    case 'qznext': view.qn++; view.pick=null; render(); break;
    case 'qzagain': view.quiz=null; render(); break;
    case 'reset':
      if (view.confirmReset){ S.r={}; S.q={}; S.exams=[]; save(); view.confirmReset=false; render(); }
      else { view.confirmReset=true; const b=app.querySelector('[data-act=reset]'); b.textContent=T('Сигурно? Додирни још једном'); }
      break;
  }
}
/* ---------- Инсталација ---------- */
let deferredPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const installBtn = document.getElementById('installBtn');
const sheet = document.getElementById('sheet');
function updateInstallBtn(){
  installBtn.hidden = isStandalone() || location.protocol === 'file:';
  installBtn.textContent = T('Инсталирај');
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; updateInstallBtn(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; updateInstallBtn(); showSheet('done'); });
function showSheet(kind){
  let h;
  if (kind === 'ios'){
    const inSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios|instagram|fban|fbav|whatsapp/i.test(navigator.userAgent);
    h = '<h3 id="sheetTitle">Додај на почетни екран</h3>' +
      (inSafari ? '' : '<p class="note card small" style="margin:8px 0">На iPhone-у ово ради само у Safari-ју. Отвори овај линк у Safari-ју, па настави.</p>') +
      '<ol><li>Додирни дугме <span class="kbd">Подијели</span> (квадрат са стрелицом нагоре), доле на екрану.</li>' +
      '<li>Скролуј и изабери <span class="kbd">Додај на почетни екран</span> (Add to Home Screen).</li>' +
      '<li>Додирни <span class="kbd">Додај</span> горе десно.</li></ol>' +
      '<p class="small muted">Иконица „И“ се појави међу апликацијама и отвара се преко цијелог екрана.</p>';
  } else if (kind === 'done'){
    h = '<h3 id="sheetTitle">Инсталирано</h3><p>Апликација је сад на почетном екрану. Ради и без интернета.</p>';
  } else {
    h = '<h3 id="sheetTitle">Инсталирај апликацију</h3><ol>' +
      '<li>Отвори мени прегледача <span class="kbd">⋮</span> горе десно.</li>' +
      '<li>Изабери <span class="kbd">Инсталирај апликацију</span> или <span class="kbd">Додај на почетни екран</span>.</li>' +
      '<li>Потврди са <span class="kbd">Инсталирај</span>.</li></ol>' +
      '<p class="small muted">Ако тога нема у менију, отвори линк у Chrome-у.</p>';
  }
  h += '<button class="btn primary block" id="sheetClose">У реду</button>';
  document.getElementById('sheetPanel').innerHTML = T(h);
  sheet.hidden = false;
  document.getElementById('sheetClose').focus();
  document.getElementById('sheetClose').onclick = () => { sheet.hidden = true; };
}
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') sheet.hidden = true; });
installBtn.addEventListener('click', async () => {
  if (deferredPrompt){
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch(e) {}
    deferredPrompt = null; updateInstallBtn();
  } else showSheet(isIOS() ? 'ios' : 'other');
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

document.getElementById('scriptBtn').addEventListener('click',()=>{ S.script = S.script==='lat'?'cyr':'lat'; save(); const t0=view.t0; render(); if(t0) view.t0=t0; });
render();
</script>
</body>
</html>
